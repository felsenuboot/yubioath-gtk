name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and GObject introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            gir1.2-gdkpixbuf-2.0 librsvg2-common libpcsclite-dev swig
      - name: Install Python dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet yubikey-manager pytest ruff pip-audit
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test
        run: .venv/bin/pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: .venv/bin/pip-audit --strict --progress-spinner off
