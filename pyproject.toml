[project]
name = "yubioath-gtk"
version = "0.2.0"
description = "OATH one-time passwords from your YubiKey, in GTK4 + libadwaita"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "felsenuboot" }]
keywords = ["yubikey", "oath", "totp", "hotp", "2fa", "gtk4", "libadwaita"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = ["yubikey-manager>=5.5", "PyGObject>=3.46"]

[project.urls]
Homepage = "https://github.com/felsenuboot/yubioath-gtk"
Issues = "https://github.com/felsenuboot/yubioath-gtk/issues"
Changelog = "https://github.com/felsenuboot/yubioath-gtk/blob/master/CHANGELOG.md"

[project.scripts]
yubioath-gtk = "yubioath_gtk.app:main_entry"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yubioath_gtk"]

[tool.setuptools.package-data]
yubioath_gtk = ["*.css", "icons/**/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL", "RUF", "PERF", "BLE", "C4", "PIE", "RET", "ISC", "N", "S"]
ignore = [
  "E501",    # line length: ruff format handles it
  "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR2004",  # complexity / magic-number heuristics
  "PLC0415", # imports inside functions are deliberate (lazy gi/ykman imports)
  "N802", "N803", "N815", "N818",  # GObject vtable names (do_startup), signal arg names
  "RUF012",  # __gsignals__ dicts are the PyGObject convention
  "PLW2901", # loop variable overwrite in tight loops is fine here
  "ISC001",  # conflicts with the formatter
  "S603",    # subprocess argv is built from constants and shutil.which(), never from user input
]

[tool.ruff.lint.per-file-ignores]
"yubioath_gtk/_fake.py" = ["PLR6301"]
"tests/*" = ["PLR2004", "S101", "S108"]
